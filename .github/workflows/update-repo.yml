name: Update APT repo

on:
  repository_dispatch:
    types: [publish]

# Serializa los dispatches que llegan a este repo (p. ej. debian12 y debian13)
# para no pisarse en el push a la rama.
concurrency:
  group: apt-repo-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      APP_REPO: ${{ github.event.client_payload.repo }}
      TAG: ${{ github.event.client_payload.tag }}
      APP: ${{ github.event.client_payload.app }}
      VERSION: ${{ github.event.client_payload.version }}
      CODENAME: ${{ github.event.client_payload.codename }}
      ARTIFACT: ${{ github.event.client_payload.artifact }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install reprepro
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq reprepro gnupg2

      - name: Import signing key
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$KEY" | gpg --batch --import

      - name: Download artifact from app release
        run: |
          mkdir -p incoming
          curl -fsSL -o "incoming/$ARTIFACT" \
            "https://github.com/$APP_REPO/releases/download/$TAG/$ARTIFACT"

      - name: Include package and prune older versions
        run: |
          set -e
          # El pool de reprepro es COMPARTIDO entre codenames y deriva el nombre
          # del archivo del control del paquete. Dos codenames con el mismo
          # (pkg, ver, arch) pisarían el .deb del otro aunque el contenido (venv)
          # sea distinto. Se repackea con una revisión "+<codename>" para que cada
          # base tenga su propio archivo de pool y su versión.
          PKGVER="$VERSION-1+$CODENAME"
          mkdir -p "repack"
          rm -rf "repack/$CODENAME"
          dpkg-deb -R "incoming/$ARTIFACT" "repack/$CODENAME"
          sed "s/^Version:.*/Version: $PKGVER/" -i "repack/$CODENAME/DEBIAN/control"
          dpkg-deb --build --root-owner-group "repack/$CODENAME" "incoming/$CODENAME.deb"
          reprepro -b . includedeb "$CODENAME" "incoming/$CODENAME.deb"
          # Mantener solo la versión recién publicada (poda de versiones viejas).
          reprepro -b . removefilter "$CODENAME" "Package (== $APP), Version (!= $PKGVER)"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish $APP $VERSION into $CODENAME" || echo "Nada que commitear"
          for i in 1 2 3 4 5; do
            if git push origin main; then
              break
            fi
            echo "push rechazado (race), rebeaseo e intento de nuevo ($i)"
            git pull --rebase origin main
          done